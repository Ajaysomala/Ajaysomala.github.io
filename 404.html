<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page not found — Somala Ajay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg:#070708; --text:#e8e6e3; --muted:#8f8b84; --accent:#00d4aa; --fd:"Bricolage Grotesque",sans-serif; --fb:Figtree,sans-serif; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:var(--fb);padding:2rem;text-align:center;
      background-image:radial-gradient(ellipse 50% 40% at 50% 30%,rgba(0,212,170,.08),transparent 60%)}
    .code{font-family:var(--fd);font-size:clamp(4rem,18vw,9rem);font-weight:800;letter-spacing:-.06em;line-height:1;color:rgba(232,230,227,.08)}
    h1{font-family:var(--fd);font-size:clamp(1.5rem,4vw,2.2rem);margin:.5rem 0 1rem;letter-spacing:-.03em}
    p{color:var(--muted);max-width:32ch;margin:0 auto 2rem}
    a{display:inline-flex;padding:.9rem 1.5rem;background:#f7f5f2;color:#070708;font-weight:600;font-size:.8rem;letter-spacing:.04em;border-radius:4px;text-decoration:none}
    a:hover{background:#fff}
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>This route isn’t in the model.</h1>
